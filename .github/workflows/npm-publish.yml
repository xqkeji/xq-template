name: Publish to npm (OIDC Trusted Publishing)

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write   # 必须：npm Trusted Publishing 用 OIDC 取临时令牌
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish
        run: npm publish --access public
        # 无需 NODE_AUTH_TOKEN：npm 通过 OIDC (id-token) 自动完成 Trusted Publishing
